<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Session 如何采集</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f5f5f5}body{display:grid;place-items:center;font-family:Geist,"Noto Sans SC","Microsoft YaHei",sans-serif}.frame{width:100%;overflow:auto}svg{display:block;width:100%;min-width:900px;height:auto}.title{font:400 40px "Instrument Serif","Noto Serif SC",serif;fill:#2d3142}.eyebrow,.mono{font-family:"Geist Mono","Noto Sans Mono CJK SC",monospace}.eyebrow{font-size:12px;letter-spacing:2px;fill:#4f5d75}.zone-title{font:600 14px "Geist Mono","Noto Sans Mono CJK SC",monospace;letter-spacing:1px;fill:#4f5d75}.label{font-size:16px;font-weight:600;fill:#2d3142}.sub{font-size:12px;fill:#4f5d75}.node{fill:#fff;stroke:#4f5d75;stroke-width:2}.accent{fill:#fff5ef;stroke:#eb6c36;stroke-width:3}.store{fill:#eef3fb;stroke:#2e5aa8;stroke-width:2}.zone{fill:#fff;stroke:#c8cdd7;stroke-width:2}.server{fill:#f1f4f8}.flow{fill:none;stroke:#4f5d75;stroke-width:2;marker-end:url(#capture-arrow)}.primary{fill:none;stroke:#eb6c36;stroke-width:3;marker-end:url(#capture-arrow-accent)}.upload{fill:none;stroke:#2e5aa8;stroke-width:2;stroke-dasharray:8 8;marker-end:url(#capture-arrow-link)}.edge{font:500 12px "Geist Mono","Noto Sans Mono CJK SC",monospace;fill:#4f5d75}.note{fill:#fff8e8;stroke:#d6a63c;stroke-width:2}.note-title{font:600 13px "Geist Mono","Noto Sans Mono CJK SC",monospace;fill:#604a18}.note-copy{font-size:13px;fill:#604a18}
  </style>
</head>
<body><div class="frame">
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="capture-title capture-desc">
  <title id="capture-title">Session 如何采集</title>
  <desc id="capture-desc">用户机器上的 XSkill 客户端等待原生会话日志停止写入，再通过对应适配器转换成统一的 Markdown 会话文本。Team 模式下，客户端脱敏后上传到服务端会话库。Bridge 是这种统一会话文本的内部名称。</desc>
  <defs>
    <marker id="capture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
    <marker id="capture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
    <marker id="capture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#f5f5f5"/>
  <text class="eyebrow" x="48" y="44">QUESTION 1 · SESSION CAPTURE</text>
  <text class="title" x="48" y="88">先保留事实，再统一格式</text>

  <rect class="zone" x="48" y="124" width="824" height="464" rx="16"/>
  <rect class="zone server" x="912" y="124" width="320" height="464" rx="16"/>

  <!-- Connectors first -->
  <path class="flow" d="M248 320 H296"/>
  <path class="primary" d="M496 320 H544"/>
  <path class="flow" d="M744 320 H792"/>
  <path class="upload" d="M872 320 H952"/>

  <text class="zone-title" x="72" y="154">用户机器 · LOCAL</text>
  <text class="sub" x="72" y="178">读取 Agent 已经写出的文件，不改 Agent 进程</text>
  <rect class="store" x="88" y="256" width="160" height="128" rx="12"/>
  <text class="label" x="168" y="288" text-anchor="middle">原生会话日志</text>
  <text class="sub" x="168" y="316" text-anchor="middle">Claude · Codex · …</text>
  <text class="sub mono" x="168" y="340" text-anchor="middle">JSONL / SQLite</text>
  <text class="sub" x="168" y="364" text-anchor="middle">原始消息与工具调用</text>
  <rect class="node" x="296" y="256" width="200" height="128" rx="12"/>
  <text class="label" x="396" y="288" text-anchor="middle">等待写入结束</text>
  <text class="sub" x="396" y="316" text-anchor="middle">日志静默一段时间后再读</text>
  <text class="sub" x="396" y="340" text-anchor="middle">对应适配器解析格式</text>
  <text class="sub" x="396" y="364" text-anchor="middle">筛选并截断超长内容</text>
  <rect class="accent" x="544" y="256" width="200" height="128" rx="12"/>
  <text class="label" x="644" y="288" text-anchor="middle">统一会话文本</text>
  <text class="sub mono" x="644" y="316" text-anchor="middle">Bridge · traj_*.md</text>
  <text class="sub" x="644" y="340" text-anchor="middle">统一 user / assistant / tool</text>
  <text class="sub" x="644" y="364" text-anchor="middle">后续只处理这一种格式</text>
  <rect class="node" x="792" y="256" width="80" height="128" rx="12"/>
  <text class="label" x="832" y="300" text-anchor="middle">脱敏</text>
  <text class="sub" x="832" y="328" text-anchor="middle">凭证</text>
  <text class="sub" x="832" y="348" text-anchor="middle">替换</text>

  <text class="zone-title" x="936" y="154">XSkill 服务端 · SERVER</text>
  <text class="sub" x="936" y="178">Team 模式才上传</text>
  <rect class="store" x="952" y="256" width="240" height="128" rx="12"/>
  <text class="label" x="1072" y="288" text-anchor="middle">团队会话库</text>
  <text class="sub" x="1072" y="316" text-anchor="middle">统一文本</text>
  <text class="sub" x="1072" y="340" text-anchor="middle">模型名 · 运行时 · 内容哈希</text>
  <text class="sub" x="1072" y="364" text-anchor="middle">等待服务端流水线处理</text>

  <text class="edge" x="272" y="304" text-anchor="middle">READ</text>
  <text class="edge" x="520" y="304" text-anchor="middle">NORMALIZE</text>
  <text class="edge" x="912" y="304" text-anchor="middle">UPLOAD</text>

  <rect class="note" x="296" y="432" width="448" height="88" rx="12"/>
  <text class="note-title" x="320" y="464">BRIDGE 是什么？</text>
  <text class="note-copy" x="320" y="492">就是“统一格式的会话副本”，不是网络代理，也不是一个额外模型。</text>
</svg>
</div></body>
</html>
