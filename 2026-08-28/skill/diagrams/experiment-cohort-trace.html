<!DOCTYPE html>

  <style>

<body><div class="frame">
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="experiment-title experiment-desc">

  <desc id="experiment-desc">完整长会话包含十四个用户意图，TaskAgent 进行了三十六次 look 和二十九轮推理，消耗六十二万八千二百零五 tokens 却没有 submit_atom。Case2-only 重放在二十四点八秒内提交三个 Atom，但人工预期只有一个，结果包含一次过切和一个 exit 噪声。</desc>
  <defs>
    <marker id="experiment-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
    <marker id="experiment-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
    <marker id="experiment-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#f5f5f5"/>

  <text class="lane-title" x="68" y="364">CASE 2-ONLY · MECHANICAL REPLAY</text>

  <!-- connectors first -->
  <path class="flow" d="M328 224 H376"/><path class="flow" d="M624 224 H672"/><path class="flow-accent" d="M920 224 H968"/>
  <path class="flow" d="M328 432 H376"/><path class="flow" d="M624 432 H672"/><path class="flow-accent" d="M920 432 H968"/>

  <rect class="node" x="96" y="176" width="232" height="96" rx="12"/>
  <text class="big" x="212" y="212" text-anchor="middle">146 turns</text><text class="sub" x="212" y="236" text-anchor="middle">14 user intents · 44 tool calls</text><text class="sub" x="212" y="256" text-anchor="middle">88,672-byte Bridge</text>
