<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="skill-version-title skill-version-desc">
      <title id="skill-version-title">Evidence to an active Skill version</title>
      <desc id="skill-version-desc">Candidate evidence waits until its weightscore reaches ten, then SkillEdit creates a new Baby-to-Main Skill or updates an existing Skill through Staging and a Canary decision before selecting the active Main version.</desc>
      <defs>
        <style>
          @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');
          .node-name{fill:#2d3142;font:600 12px 'Geist',sans-serif;text-anchor:middle}.sub{fill:#4f5d75;font:400 9px 'Geist Mono',monospace;text-anchor:middle}.edge-label{fill:#4f5d75;font:400 8px 'Geist Mono',monospace;letter-spacing:.08em;text-anchor:middle}.edge-label.accent{fill:#eb6c36}.legend{fill:#4f5d75;font:400 8.5px 'Geist',sans-serif}.legend-tag{fill:#4f5d75;font:500 8px 'Geist Mono',monospace;letter-spacing:.18em}
        </style>
        <marker id="version-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
        <marker id="version-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
        <marker id="version-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="1000" height="720" fill="#f5f5f5"/>

      <!-- Connectors first. -->
      <line x1="500" y1="88" x2="500" y2="112" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#version-arrow)"/>
      <!-- Threshold not reached: accumulate more evidence and return to Candidate. -->
      <path d="M600 160 H680 Q688 160 688 152 V72 Q688 64 680 64 H580" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#version-arrow)"/>
      <rect x="604" y="136" width="72" height="12" rx="2" fill="#f5f5f5"/><text x="640" y="145" class="edge-label">NO · ACCUMULATE</text>
      <!-- Threshold reached. -->
      <line x1="500" y1="208" x2="500" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#version-arrow)"/>
      <rect x="516" y="216" width="28" height="12" rx="2" fill="#f5f5f5"/><text x="530" y="225" class="edge-label">YES</text>
      <line x1="500" y1="288" x2="500" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#version-arrow)"/>
      <!-- Existing Main: yes to Staging, no to Baby graduation. -->
      <line x1="600" y1="368" x2="720" y2="368" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#version-arrow)"/>
      <rect x="640" y="344" width="28" height="12" rx="2" fill="#f5f5f5"/><text x="654" y="353" class="edge-label">YES</text>
      <line x1="500" y1="416" x2="500" y2="448" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#version-arrow)"/>
      <rect x="516" y="424" width="24" height="12" rx="2" fill="#f5f5f5"/><text x="528" y="433" class="edge-label">NO</text>
      <line x1="800" y1="392" x2="800" y2="472" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#version-arrow)"/>
      <rect x="812" y="424" width="64" height="12" rx="2" fill="#f5f5f5"/><text x="844" y="433" class="edge-label">REAL SESSIONS</text>
      <line x1="500" y1="504" x2="500" y2="600" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#version-arrow)"/>
      <!-- Both Canary outcomes converge on one active Main, by different routes. -->
      <path d="M700 520 H648 Q640 520 640 528 V624" fill="none" stroke="#eb6c36" stroke-width="1.4"/>
      <rect x="648" y="496" width="48" height="12" rx="2" fill="#f5f5f5"/><text x="672" y="505" class="edge-label accent">STAGING</text>
      <path d="M800 568 V620 Q800 628 792 628 H644" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
      <rect x="704" y="604" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="732" y="613" class="edge-label">KEEP MAIN</text>
      <circle cx="640" cy="628" r="4" fill="#2d3142"/>
      <line x1="636" y1="628" x2="580" y2="628" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#version-arrow-accent)"/>

      <!-- Candidate evidence. -->
      <rect x="420" y="40" width="160" height="48" rx="24" fill="rgba(45,49,66,.03)" stroke="rgba(45,49,66,.30)"/>
      <text x="500" y="64" class="node-name">Candidate Buffer</text><text x="500" y="80" class="sub">Atom contributions</text>

      <!-- Threshold decision. -->
      <polygon points="500,112 600,160 500,208 400,160" fill="#fff" stroke="#2d3142"/>
      <text x="500" y="156" class="node-name">Σ weightscore</text><text x="500" y="174" class="sub">≥ 10?</text>

      <!-- Evidence-backed editing. -->
      <rect x="420" y="240" width="160" height="48" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="500" y="264" class="node-name">SkillEditAgent</text><text x="500" y="280" class="sub">read evidence · write Skill</text>

      <!-- Existing-Main decision. -->
      <polygon points="500,320 600,368 500,416 400,368" fill="#fff" stroke="#2d3142"/>
      <text x="500" y="364" class="node-name">Main exists?</text><text x="500" y="382" class="sub">new or update</text>

      <!-- New Skill path. -->
      <rect x="420" y="448" width="160" height="56" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="500" y="474" class="node-name">Baby → Main</text><text x="500" y="492" class="sub">checkpoint · graduate</text>

      <!-- Existing Skill path. -->
      <rect x="720" y="344" width="160" height="48" rx="6" fill="rgba(45,49,66,.05)" stroke="#4f5d75"/>
      <text x="800" y="368" class="node-name">Staging</text><text x="800" y="384" class="sub">proposed Git version</text>

      <!-- The consequential evaluation gate. -->
      <polygon points="800,472 900,520 800,568 700,520" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="800" y="516" class="node-name">Canary winner?</text><text x="800" y="534" class="sub">version-bound UX</text>

      <!-- One selected version becomes active. -->
      <rect x="420" y="600" width="160" height="56" rx="28" fill="rgba(235,108,54,.08)" stroke="#eb6c36"/>
      <text x="500" y="626" class="node-name">Active Main</text><text x="500" y="644" class="sub">distributable Skill SHA</text>

      <!-- Legend. -->
      <line x1="40" y1="680" x2="960" y2="680" stroke="rgba(45,49,66,.10)" stroke-width=".8"/>
      <text x="40" y="704" class="legend-tag">LEGEND</text>
      <rect x="144" y="692" width="24" height="12" rx="6" fill="rgba(45,49,66,.03)" stroke="rgba(45,49,66,.30)"/><text x="180" y="702" class="legend">durable state / outcome</text>
      <rect x="356" y="692" width="24" height="12" rx="2" fill="#fff" stroke="#2d3142"/><text x="392" y="702" class="legend">action</text>
      <polygon points="500,698 512,692 524,698 512,704" fill="#fff" stroke="#2d3142"/><text x="536" y="702" class="legend">decision</text>
      <line x1="656" y1="700" x2="684" y2="700" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#version-arrow-accent)"/><text x="696" y="702" class="legend">selected version</text>
    </svg>
