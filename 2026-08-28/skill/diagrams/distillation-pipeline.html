<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Session 如何生成 Skill</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f5f5f5}body{display:grid;place-items:center;font-family:Geist,"Noto Sans SC","Microsoft YaHei",sans-serif}.frame{width:100%;overflow:auto}svg{display:block;width:100%;min-width:900px;height:auto}.title{font:400 40px "Instrument Serif","Noto Serif SC",serif;fill:#2d3142}.eyebrow,.mono{font-family:"Geist Mono","Noto Sans Mono CJK SC",monospace}.eyebrow{font-size:12px;letter-spacing:2px;fill:#4f5d75}.zone-title{font:600 14px "Geist Mono","Noto Sans Mono CJK SC",monospace;letter-spacing:1px;fill:#4f5d75}.label{font-size:16px;font-weight:600;fill:#2d3142}.sub{font-size:12px;fill:#4f5d75}.zone{fill:#f1f4f8;stroke:#c8cdd7;stroke-width:2}.node{fill:#fff;stroke:#4f5d75;stroke-width:2}.agent{fill:#fff5ef;stroke:#eb6c36;stroke-width:3}.store{fill:#eef3fb;stroke:#2e5aa8;stroke-width:2}.flow{fill:none;stroke:#4f5d75;stroke-width:2;marker-end:url(#distill-arrow)}.primary{fill:none;stroke:#eb6c36;stroke-width:3;marker-end:url(#distill-arrow-accent)}.edge{font:500 12px "Geist Mono","Noto Sans Mono CJK SC",monospace;fill:#4f5d75}.step{font:600 12px "Geist Mono","Noto Sans Mono CJK SC",monospace;fill:#eb6c36}.note{fill:#fff8e8;stroke:#d6a63c;stroke-width:2}.note-copy{font-size:13px;fill:#604a18}
  </style>
</head>
<body><div class="frame">
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="distill-title distill-desc">
  <title id="distill-title">Session 如何生成 Skill</title>
  <desc id="distill-desc">Team 模式下三个 Agent 都运行在 XSkill 服务端。TaskAgent 把会话切成单一任务并给出任务体验分；TaskClusterAgent 决定任务应支持哪个 Skill，并给出复用权重；候选权重累计到默认门槛十后，SkillEditAgent 改写服务端 Skill Git 仓库。</desc>
  <defs>
    <marker id="distill-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
    <marker id="distill-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#f5f5f5"/>
  <text class="eyebrow" x="48" y="44">QUESTION 2 · SERVER PIPELINE</text>
  <text class="title" x="48" y="88">三次收窄：切任务、找归属、改版本</text>

  <rect class="zone" x="48" y="124" width="1184" height="464" rx="16"/>
  <text class="zone-title" x="72" y="154">XSKILL 服务端 · 三个 Agent 都在这里运行</text>

  <!-- Connectors first -->
  <path class="flow" d="M208 332 H248"/>
  <path class="primary" d="M416 332 H456"/>
  <path class="flow" d="M616 332 H656"/>
  <path class="primary" d="M824 332 H864"/>
  <path class="flow" d="M1024 332 H1064"/>

  <rect class="store" x="72" y="260" width="136" height="144" rx="12"/>
  <text class="label" x="140" y="296" text-anchor="middle">统一会话</text>
  <text class="sub" x="140" y="324" text-anchor="middle">一段长 Session</text>
  <text class="sub" x="140" y="348" text-anchor="middle">含多个用户意图</text>

  <rect class="agent" x="248" y="244" width="168" height="176" rx="12"/>
  <text class="step" x="272" y="276">01</text>
  <text class="label" x="332" y="308" text-anchor="middle">TaskAgent</text>
  <text class="sub" x="332" y="340" text-anchor="middle">找到任务切换边界</text>
  <text class="sub" x="332" y="364" text-anchor="middle">保留对应原文范围</text>
  <text class="sub" x="332" y="388" text-anchor="middle">给任务结果 1–10 分</text>

  <rect class="store" x="456" y="260" width="160" height="144" rx="12"/>
  <text class="label" x="536" y="296" text-anchor="middle">任务片段 Atom</text>
  <text class="sub" x="536" y="324" text-anchor="middle">一个连续用户意图</text>
  <text class="sub mono" x="536" y="348" text-anchor="middle">lines + UX score</text>
  <text class="sub" x="536" y="372" text-anchor="middle">仍能回看原会话</text>

  <rect class="agent" x="656" y="244" width="168" height="176" rx="12"/>
  <text class="step" x="680" y="276">02</text>
  <text class="label" x="740" y="308" text-anchor="middle">TaskClusterAgent</text>
  <text class="sub" x="740" y="340" text-anchor="middle">对比团队 Skill 目录</text>
  <text class="sub" x="740" y="364" text-anchor="middle">归入已有或新建 Skill</text>
  <text class="sub" x="740" y="388" text-anchor="middle">给复用价值 1–10 分</text>

  <rect class="store" x="864" y="260" width="160" height="144" rx="12"/>
  <text class="label" x="944" y="296" text-anchor="middle">候选证据 Candidate</text>
  <text class="sub" x="944" y="324" text-anchor="middle">按 Skill 累计</text>
  <text class="sub mono" x="944" y="348" text-anchor="middle">Σ weightscore</text>
  <text class="sub" x="944" y="372" text-anchor="middle">默认达到 10 才编辑</text>

  <rect class="agent" x="1064" y="244" width="144" height="176" rx="12"/>
  <text class="step" x="1088" y="276">03</text>
  <text class="label" x="1136" y="308" text-anchor="middle">SkillEditAgent</text>
  <text class="sub" x="1136" y="340" text-anchor="middle">读取候选与原文</text>
  <text class="sub" x="1136" y="364" text-anchor="middle">改写 Skill 目录</text>
  <text class="sub" x="1136" y="388" text-anchor="middle">提交服务端 Git</text>

  <text class="edge" x="228" y="316" text-anchor="middle">切分</text>
  <text class="edge" x="436" y="316" text-anchor="middle">Atom</text>
  <text class="edge" x="636" y="316" text-anchor="middle">归类</text>
  <text class="edge" x="844" y="316" text-anchor="middle">累计</text>
  <text class="edge" x="1044" y="316" text-anchor="middle">触发</text>

  <rect class="note" x="248" y="472" width="776" height="72" rx="12"/>
  <text class="note-copy" x="272" y="502">默认 10 分门槛是 SkillEditAgent 的触发配置；每条 Candidate 的 weightscore 由 TaskClusterAgent 产生。</text>
  <text class="note-copy" x="272" y="526">EditAgent 修改的是服务端 Skill 仓库，不是用户机器上的安装目录。</text>
</svg>
</div></body>
</html>
