<!DOCTYPE html>

  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f5f5f5}body{display:grid;place-items:center;font-family:Geist,"Noto Sans SC","Microsoft YaHei",sans-serif}.frame{width:100%;overflow:auto}svg{display:block;width:100%;min-width:900px;height:auto}.title{font:400 40px "Instrument Serif","Noto Serif SC",serif;fill:#2d3142}.eyebrow,.mono{font-family:"Geist Mono",monospace}.eyebrow{font-size:12px;letter-spacing:2px;fill:#4f5d75}.station{fill:#f5f5f5;stroke:#2d3142;stroke-width:2}.station.focal{fill:#fff5ef;stroke:#eb6c36;stroke-width:3}.hub{fill:#2d3142}.node-name{font-size:16px;font-weight:600;fill:#2d3142;text-anchor:middle}.focal-name{fill:#a33f1b}.sublabel{font:400 12px "Geist Mono",monospace;fill:#4f5d75;text-anchor:middle}.hub-name{font-size:20px;font-weight:600;fill:#f5f5f5;text-anchor:middle}.hub-sub{font:400 12px "Geist Mono",monospace;fill:#f5f5f5;opacity:.72;text-anchor:middle}.ring{fill:none;stroke:#4f5d75;stroke-width:2}.spoke{fill:none;stroke:#7a8399;stroke-width:2;stroke-dasharray:8 8}.note{fill:#fff;stroke:#c8cdd7;stroke-width:2}.note-label{font:600 12px "Geist Mono",monospace;fill:#4f5d75;letter-spacing:1px}.note-copy{font-size:12px;fill:#4f5d75}.tiny{font-size:12px;fill:#4f5d75}

<body><div class="frame">
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="feedback-loop-title feedback-loop-desc">
  <title id="feedback-loop-title">已有 Skill 的新版本先接受小流量检验</title>
  <desc id="feedback-loop-desc">团队正在使用 Main 当前版本。新改动保存为 Staging 候选版本，默认只交给约百分之二十的合适用户。真实任务形成带版本归因的 UX 证据，系统比较两个版本，胜者成为下一轮 Main。Git 保存每轮版本和被拒历史。</desc>
  <defs>
    <marker id="feedback-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
    <marker id="feedback-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
    <marker id="feedback-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
    <marker id="feedback-arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#7a8399"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#f5f5f5"/>
  <text class="eyebrow" x="48" y="44">QUESTION 3 · LIVE TRAFFIC CANARY</text>
  <text class="title" x="48" y="88">已有 Skill 的新版本先接受小流量检验</text>

  <path class="ring" d="M720 153.726 A240 240 0 0 1 824.969 227.073" marker-end="url(#feedback-arrow)"/>
  <path class="ring" d="M863.285 292 A240 240 0 0 1 863.722 466.882" marker-end="url(#feedback-arrow)"/>
  <path class="ring" d="M825.731 532 A240 240 0 0 1 721.130 605.871" marker-end="url(#feedback-arrow)"/>
  <path class="ring" d="M560 606.274 A240 240 0 0 1 455.031 532.927" marker-end="url(#feedback-arrow)"/>
  <path class="ring" d="M416.715 468 A240 240 0 0 1 416.278 293.118" marker-end="url(#feedback-arrow)"/>
  <path class="ring" d="M454.269 228 A240 240 0 0 1 558.870 154.129" marker-end="url(#feedback-arrow)"/>

  <path class="spoke" d="M640 172 V320" marker-end="url(#feedback-arrow-soft)"/>
  <path class="spoke" d="M792 292 L736 324" marker-end="url(#feedback-arrow-soft)"/>
  <path class="spoke" d="M792 468 L736 436" marker-end="url(#feedback-arrow-soft)"/>
  <path class="spoke" d="M640 588 V440" marker-end="url(#feedback-arrow-soft)"/>
  <path class="spoke" d="M488 468 L544 436" marker-end="url(#feedback-arrow-soft)"/>
  <path class="spoke" d="M488 292 L544 324" marker-end="url(#feedback-arrow-soft)"/>

  <rect x="560" y="108" width="160" height="64" rx="12" class="station"/>
  <text x="640" y="136" class="node-name">当前版本 Main</text><text x="640" y="156" class="sublabel">团队正在使用</text>
  <rect x="768" y="228" width="160" height="64" rx="12" class="station"/>
  <text x="848" y="256" class="node-name">候选版本 Staging</text><text x="848" y="276" class="sublabel">不覆盖 Main</text>
  <rect x="768" y="468" width="160" height="64" rx="12" class="station"/>
  <text x="848" y="496" class="node-name">小流量试用</text><text x="848" y="516" class="sublabel">默认约 20%</text>
  <rect x="560" y="588" width="160" height="64" rx="12" class="station"/>
  <text x="640" y="616" class="node-name">真实任务</text><text x="640" y="636" class="sublabel">用户照常工作</text>
  <rect x="352" y="468" width="160" height="64" rx="12" class="station"/>
  <text x="432" y="496" class="node-name">形成 UX 证据</text><text x="432" y="516" class="sublabel">side + SHA + score</text>
  <rect x="352" y="228" width="160" height="64" rx="12" class="station focal"/>
  <text x="432" y="256" class="node-name focal-name">比较并裁决</text><text x="432" y="276" class="sublabel">胜者进入下一轮</text>

  <rect x="528" y="324" width="224" height="112" rx="16" class="hub"/>
  <text x="640" y="372" class="hub-name">Git 版本 + 证据账本</text>
  <text x="640" y="400" class="hub-sub">每轮可 diff · rollback · audit</text>

  <rect class="note" x="984" y="168" width="248" height="392" rx="16"/>
  <text class="note-label" x="1008" y="204">WHY IT WORKS</text>
  <text class="note-copy" x="1008" y="236">新版本先与旧版本并存，</text><text class="note-copy" x="1008" y="256">不会一次覆盖全体用户。</text>
  <line x1="1008" y1="280" x2="1208" y2="280" stroke="#c8cdd7" stroke-width="2"/>
  <text class="note-label" x="1008" y="316">“用户反馈”是什么</text>
  <text class="note-copy" x="1008" y="348">用户照常完成真实任务；</text><text class="note-copy" x="1008" y="368">评分器从交互轨迹生成</text>
  <text class="note-copy" x="1008" y="392">1–10 的 UX score，用户</text><text class="note-copy" x="1008" y="412">不用额外管理版本。</text>
  <line x1="1008" y1="436" x2="1208" y2="436" stroke="#c8cdd7" stroke-width="2"/>
  <text class="note-label" x="1008" y="472">成立的前提</text>
  <text class="note-copy" x="1008" y="504">必须准确记录用户实际拿到</text><text class="note-copy" x="1008" y="524">的 side 与 commit SHA。</text>
