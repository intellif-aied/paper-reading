<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XSkill 的本地端与服务端边界</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f5f5f5}body{display:grid;place-items:center;font-family:Geist,"Noto Sans SC","Microsoft YaHei",sans-serif}.frame{width:100%;overflow:auto}svg{display:block;width:100%;min-width:900px;height:auto}.title{font:400 40px "Instrument Serif","Noto Serif SC",serif;fill:#2d3142}.eyebrow,.mono{font-family:"Geist Mono","Noto Sans Mono CJK SC",monospace}.eyebrow{font-size:12px;letter-spacing:2px;fill:#4f5d75}.zone-title{font:600 14px "Geist Mono","Noto Sans Mono CJK SC",monospace;letter-spacing:1px;fill:#4f5d75}.label{font-size:16px;font-weight:600;fill:#2d3142}.sub{font-size:12px;fill:#4f5d75}.zone{fill:#fff;stroke:#c8cdd7;stroke-width:2}.server{fill:#f1f4f8}.node{fill:#fff;stroke:#4f5d75;stroke-width:2}.accent{fill:#fff5ef;stroke:#eb6c36;stroke-width:3}.store{fill:#eef3fb;stroke:#2e5aa8;stroke-width:2}.flow{fill:none;stroke:#4f5d75;stroke-width:2;marker-end:url(#system-arrow)}.primary{fill:none;stroke:#eb6c36;stroke-width:3;marker-end:url(#system-arrow-accent)}.return{fill:none;stroke:#2e5aa8;stroke-width:2;stroke-dasharray:8 8;marker-end:url(#system-arrow-link)}.edge{font:500 12px "Geist Mono","Noto Sans Mono CJK SC",monospace;fill:#4f5d75}.note{fill:#fff8e8;stroke:#d6a63c;stroke-width:2}.note-text{font-size:13px;fill:#604a18}
  </style>
</head>
<body><div class="frame">
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="system-title system-desc">
  <title id="system-title">XSkill 的本地端与服务端边界</title>
  <desc id="system-desc">用户机器上的 Coding Agent 产生会话日志。XSkill 客户端上传统一会话，服务端运行三个 Agent 并维护团队 Skill Git 仓库。服务端为每个客户端生成带版本提交号的清单，客户端再把指定版本安装回本机 Agent 的 Skill 目录。</desc>
  <defs>
    <marker id="system-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
    <marker id="system-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
    <marker id="system-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#f5f5f5"/>
  <text class="eyebrow" x="48" y="44">ARCHITECTURE · TEAM MODE</text>
  <text class="title" x="48" y="88">本地负责采集与安装，服务端负责学习与版本</text>

  <rect class="zone" x="48" y="124" width="320" height="496" rx="16"/>
  <rect class="zone server" x="408" y="124" width="824" height="496" rx="16"/>

  <!-- Connectors first -->
  <path class="flow" d="M208 264 V304"/>
  <path class="primary" d="M208 400 V448"/>
  <path class="primary" d="M328 500 H448 V248 H480"/>
  <path class="flow" d="M680 248 H728"/>
  <path class="flow" d="M928 248 H976"/>
  <path class="flow" d="M1080 300 V400"/>
  <path class="return" d="M976 452 H896 V532 H328"/>
  <path class="return" d="M128 448 V272"/>

  <text class="zone-title" x="72" y="154">用户机器 · LOCAL</text>
  <text class="sub" x="72" y="178">写日志、上传、同步、安装；不运行提炼模型</text>
  <rect class="node" x="88" y="200" width="240" height="64" rx="12"/>
  <text class="label" x="208" y="228" text-anchor="middle">Coding Agent</text>
  <text class="sub" x="208" y="248" text-anchor="middle">Claude Code / Codex / …</text>
  <rect class="store" x="88" y="304" width="240" height="96" rx="12"/>
  <text class="label" x="208" y="336" text-anchor="middle">原生会话日志</text>
  <text class="sub" x="208" y="360" text-anchor="middle">JSONL / SQLite</text>
  <text class="sub" x="208" y="380" text-anchor="middle">统一后再上传</text>
  <rect class="accent" x="88" y="448" width="240" height="104" rx="12"/>
  <text class="label" x="208" y="480" text-anchor="middle">XSkill Client</text>
  <text class="sub" x="208" y="504" text-anchor="middle">上传会话 · 接收清单</text>
  <text class="sub" x="208" y="524" text-anchor="middle">对齐版本 · 安装到本机</text>

  <text class="zone-title" x="432" y="154">XSkill 服务端 · SERVER</text>
  <text class="sub" x="432" y="178">运行提炼 Agent，维护团队共享版本，决定每台机器拿到哪个提交</text>
  <rect class="store" x="480" y="200" width="200" height="96" rx="12"/>
  <text class="label" x="580" y="232" text-anchor="middle">会话库</text>
  <text class="sub" x="580" y="256" text-anchor="middle">统一文本 + 元数据</text>
  <text class="sub" x="580" y="276" text-anchor="middle">按用户与会话保存</text>
  <rect class="accent" x="728" y="200" width="200" height="96" rx="12"/>
  <text class="label" x="828" y="232" text-anchor="middle">三个处理 Agent</text>
  <text class="sub" x="828" y="256" text-anchor="middle">切任务 · 归类 · 改 Skill</text>
  <text class="sub" x="828" y="276" text-anchor="middle">都在服务端运行</text>
  <rect class="store" x="976" y="200" width="208" height="100" rx="12"/>
  <text class="label" x="1080" y="232" text-anchor="middle">团队 Skill Git 仓库</text>
  <text class="sub" x="1080" y="256" text-anchor="middle">每个 Skill 一个仓库</text>
  <text class="sub" x="1080" y="276" text-anchor="middle">Main / Staging / commit SHA</text>
  <rect class="node" x="976" y="400" width="208" height="104" rx="12"/>
  <text class="label" x="1080" y="432" text-anchor="middle">每客户端版本清单</text>
  <text class="sub mono" x="1080" y="456" text-anchor="middle">skill + side + SHA</text>
  <text class="sub" x="1080" y="480" text-anchor="middle">同一团队可分到不同版本</text>

  <text class="edge" x="388" y="468" text-anchor="middle">UPLOAD</text>
  <text class="edge" x="704" y="232" text-anchor="middle">会话</text>
  <text class="edge" x="952" y="232" text-anchor="middle">提交</text>
  <text class="edge" x="930" y="520" text-anchor="middle">清单 + Git bundle</text>

  <rect class="note" x="408" y="556" width="824" height="48" rx="12"/>
  <text class="note-text" x="432" y="586">服务端不直接修改每台机器；每个 Client 只把自己的本地副本对齐到清单指定的 commit，再交给 Agent 发现。</text>
</svg>
</div></body>
</html>
