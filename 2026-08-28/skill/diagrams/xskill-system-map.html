<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XSkill 接在 coding agent 的文件两端</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f5f5f5}body{display:grid;place-items:center;font-family:Geist,"Noto Sans SC","Microsoft YaHei",sans-serif}.frame{width:100%;overflow:auto}svg{display:block;width:100%;min-width:900px;height:auto}.title{font:400 40px "Instrument Serif","Noto Serif SC",serif;fill:#2d3142}.eyebrow,.mono{font-family:"Geist Mono",monospace}.eyebrow{font-size:12px;letter-spacing:2px;fill:#4f5d75}.zone-title{font-size:16px;font-weight:600;fill:#2d3142}.label{font-size:16px;font-weight:600;fill:#2d3142}.sub{font-size:12px;fill:#4f5d75}.tiny{font-size:12px;fill:#4f5d75}.zone{fill:#fff;stroke:#c8cdd7;stroke-width:2}.node{fill:#fff;stroke:#4f5d75;stroke-width:2}.accent{fill:#fff5ef;stroke:#eb6c36;stroke-width:2}.store{fill:#eef3fb;stroke:#2e5aa8;stroke-width:2}.flow{fill:none;stroke:#4f5d75;stroke-width:2;marker-end:url(#xskill-system-arrow)}.flow-accent{fill:none;stroke:#eb6c36;stroke-width:3;marker-end:url(#xskill-system-arrow-accent)}.flow-link{fill:none;stroke:#2e5aa8;stroke-width:2;stroke-dasharray:8 8;marker-end:url(#xskill-system-arrow-link)}.chip{fill:#2d3142}.chip-text{font:500 12px "Geist Mono",monospace;fill:#fff}.note{fill:#fff8e8;stroke:#d6a63c;stroke-width:2}.note-text{font-size:12px;fill:#604a18}
  </style>
</head>
<body><div class="frame">
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="xskill-system-title xskill-system-desc">
  <title id="xskill-system-title">XSkill 接在 coding agent 的文件两端</title>
  <desc id="xskill-system-desc">Coding agent 写出原生会话文件，XSkill 经 watcher、蒸馏与生命周期控制写入 Git Skill 仓库，再把选定版本安装回各 agent 的 Skill 目录。XSkill 不修改 agent 进程。</desc>
  <defs>
    <marker id="xskill-system-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
    <marker id="xskill-system-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
    <marker id="xskill-system-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#f5f5f5"/>
  <text class="eyebrow" x="48" y="44">ARCHITECTURE · IMPLEMENTATION BOUNDARY</text>
  <text class="title" x="48" y="88">XSkill 接在 coding agent 的文件两端</text>

  <rect class="zone" x="48" y="124" width="276" height="472" rx="16"/>
  <rect class="zone" x="364" y="124" width="540" height="472" rx="16"/>
  <rect class="zone" x="944" y="124" width="288" height="472" rx="16"/>

  <!-- connectors first -->
  <path class="flow" d="M184 252 V292"/>
  <path class="flow-accent" d="M304 340 H348"/>
  <path class="flow" d="M548 340 H580"/>
  <path class="flow" d="M776 340 H804"/>
  <path class="flow-accent" d="M884 340 H928"/>
  <path class="flow-link" d="M944 464 H876 V484 H848"/>
  <path class="flow-link" d="M688 520 H336 V484 H304"/>
  <path class="flow" d="M184 436 V396"/>
  <path class="flow-link" d="M1064 404 V372"/>

  <text class="zone-title" x="68" y="156">Agent host</text>
  <text class="sub" x="68" y="176">agent 自主管理 prompt 与上下文</text>
  <rect class="node" x="80" y="196" width="208" height="68" rx="12"/>
  <text class="label" x="184" y="224" text-anchor="middle">Coding agent</text>
  <text class="sub" x="184" y="244" text-anchor="middle">Claude / Codex / …</text>
  <rect class="node" x="80" y="292" width="208" height="96" rx="12"/>
  <text class="label" x="184" y="324" text-anchor="middle">Native sessions</text>
  <text class="sub" x="184" y="348" text-anchor="middle">JSONL / SQLite</text>
  <text class="sub" x="184" y="368" text-anchor="middle">运行时写出的原始事实</text>
  <rect class="store" x="80" y="436" width="208" height="96" rx="12"/>
  <text class="label" x="184" y="468" text-anchor="middle">Skill discovery root</text>
  <text class="sub" x="184" y="492" text-anchor="middle">完整 Skill 目录</text>
  <text class="sub" x="184" y="512" text-anchor="middle">symlink → junction → copy</text>

  <text class="zone-title" x="384" y="156">XSkill control plane</text>
  <text class="sub" x="384" y="176">采集、提炼、版本控制与回注</text>
  <rect class="accent" x="380" y="292" width="156" height="96" rx="12"/>
  <text class="label" x="458" y="324" text-anchor="middle">Watcher</text>
  <text class="sub" x="458" y="348" text-anchor="middle">quiet gate · adapter</text>
  <text class="sub" x="458" y="368" text-anchor="middle">sanitize · Bridge</text>
  <rect class="node" x="592" y="292" width="172" height="96" rx="12"/>
  <text class="label" x="678" y="324" text-anchor="middle">3-Agent pipeline</text>
  <text class="sub" x="678" y="348" text-anchor="middle">Atom · route · edit</text>
  <text class="sub" x="678" y="368" text-anchor="middle">候选证据累计</text>
  <rect class="node" x="816" y="292" width="156" height="96" rx="12"/>
  <text class="label" x="894" y="324" text-anchor="middle">Lifecycle</text>
  <text class="sub" x="894" y="348" text-anchor="middle">Git branches</text>
  <text class="sub" x="894" y="368" text-anchor="middle">Canary decision</text>
  <rect class="store" x="688" y="448" width="172" height="96" rx="12"/>
  <text class="label" x="774" y="480" text-anchor="middle">Install / reconcile</text>
  <text class="sub" x="774" y="504" text-anchor="middle">standalone 直接安装</text>
  <text class="sub" x="774" y="524" text-anchor="middle">team 按 manifest 对齐 SHA</text>

  <text class="zone-title" x="964" y="156">Persistent state</text>
  <text class="sub" x="964" y="176">算法状态落在文件与 Git</text>
  <rect class="store" x="972" y="292" width="216" height="96" rx="12"/>
  <text class="label" x="1080" y="324" text-anchor="middle">Per-skill Git repo</text>
  <text class="sub" x="1080" y="348" text-anchor="middle">SKILL.md + auxiliary files</text>
  <text class="sub" x="1080" y="368" text-anchor="middle">Baby / Main / Staging</text>
  <rect class="node" x="972" y="404" width="216" height="120" rx="12"/>
  <text class="label" x="1080" y="436" text-anchor="middle">Team manifest</text>
  <text class="sub" x="1080" y="460" text-anchor="middle">side + commit SHA</text>
  <text class="sub" x="1080" y="480" text-anchor="middle">bundle + client reconcile</text>
  <text class="sub" x="1080" y="500" text-anchor="middle">精确回注下一轮</text>

  <rect class="note" x="364" y="612" width="868" height="56" rx="12"/>
  <rect class="chip" x="380" y="624" width="100" height="28" rx="8"/>
  <text class="chip-text" x="430" y="644" text-anchor="middle">BOUNDARY</text>
  <text class="note-text" x="500" y="644">源码只证明“目录进入 agent 的 Skill 文件夹”；何时加载、怎样进入上下文，由各 agent 决定。</text>
  <text class="tiny mono" x="48" y="696">source · xskill/src/xskill/ecosystems · pipeline/runner.py · skill/git.py · team manifest/reconcile</text>
</svg>
</div></body>
</html>
