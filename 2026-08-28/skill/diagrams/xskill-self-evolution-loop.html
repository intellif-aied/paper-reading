<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XSkill self-evolution loop</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; background: #f5f5f5; color: #2d3142; font-family: 'Geist', system-ui, sans-serif; }
    .frame { width: 100%; max-width: 1280px; }
    .eyebrow { margin-bottom: .5rem; color: #4f5d75; font: 500 .66rem 'Geist Mono', monospace; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin-bottom: 1.5rem; font: 400 clamp(1.5rem, 2.4vw + .75rem, 2rem)/1.15 'Instrument Serif', serif; letter-spacing: -.02em; }
    svg { display: block; width: 100%; min-width: 900px; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Loop · Repo Reading</p>
    <h1>XSkill self-evolution loop</h1>

    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="xskill-loop-title xskill-loop-desc">
      <title id="xskill-loop-title">XSkill self-evolution loop</title>
      <desc id="xskill-loop-desc">Six stations move clockwise from installing a Skill through an agent session, trajectory bridging, Atom extraction, Skill evolution, and reinjection. Atom extraction is a mixed-result quality gate in this trial. Each station writes durable evidence into the central XSkill memory.</desc>
      <defs>
        <style>
          @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');
          .ring{fill:none;stroke:#4f5d75;stroke-width:1.2}.spoke{fill:none;stroke:#7a8399;stroke-width:1;stroke-dasharray:5 4}.station{fill:#f5f5f5;stroke:#2d3142;stroke-width:1}.station.focal{fill:rgba(235,108,54,.08);stroke:#eb6c36;stroke-width:1.2}.hub{fill:#2d3142}.node-name{fill:#2d3142;font:600 12px 'Geist',sans-serif;text-anchor:middle}.focal-name{fill:#eb6c36}.sublabel{fill:#7a8399;font:400 8px 'Geist Mono',monospace;text-anchor:middle}.hub-name{fill:#f5f5f5;font:600 16px 'Geist',sans-serif;text-anchor:middle}.hub-sub{fill:#f5f5f5;opacity:.72;font:400 8px 'Geist Mono',monospace;text-anchor:middle}.arrow-label{fill:#7a8399;font:400 8px 'Geist Mono',monospace;letter-spacing:.06em;text-anchor:middle}.legend{fill:#4f5d75;font:400 8px 'Geist',sans-serif}.legend-tag{fill:#4f5d75;font:500 8px 'Geist Mono',monospace;letter-spacing:.14em}
        </style>
        <marker id="loop-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
        <marker id="loop-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
        <marker id="loop-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
        <marker id="loop-arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#7a8399"/></marker>
      </defs>
      <rect width="1280" height="720" fill="#f5f5f5"/>

      <!-- Clockwise operating flow. -->
      <path class="ring" d="M720 133.726 A240 240 0 0 1 824.969 207.073" marker-end="url(#loop-arrow)"/>
      <path class="ring" d="M863.285 272 A240 240 0 0 1 863.722 446.882" marker-end="url(#loop-arrow)"/>
      <path class="ring" d="M825.731 512 A240 240 0 0 1 721.130 585.871" marker-end="url(#loop-arrow)"/>
      <path class="ring" d="M560 586.274 A240 240 0 0 1 455.031 512.927" marker-end="url(#loop-arrow)"/>
      <path class="ring" d="M416.715 448 A240 240 0 0 1 416.278 273.118" marker-end="url(#loop-arrow)"/>
      <path class="ring" d="M454.269 208 A240 240 0 0 1 558.870 134.129" marker-end="url(#loop-arrow)"/>

      <!-- Every phase writes durable evidence back to the hub. -->
      <path class="spoke" d="M640 152 V300" marker-end="url(#loop-arrow-soft)"/>
      <path class="spoke" d="M792 272 L736 304" marker-end="url(#loop-arrow-soft)"/>
      <path class="spoke" d="M792 448 L736 416" marker-end="url(#loop-arrow-soft)"/>
      <path class="spoke" d="M640 568 V420" marker-end="url(#loop-arrow-soft)"/>
      <path class="spoke" d="M488 448 L544 416" marker-end="url(#loop-arrow-soft)"/>
      <path class="spoke" d="M488 272 L544 304" marker-end="url(#loop-arrow-soft)"/>

      <rect x="652" y="220" width="56" height="16" rx="4" fill="#f5f5f5"/>
      <text x="680" y="232" class="arrow-label">EVIDENCE</text>
      <rect x="568" y="492" width="56" height="16" rx="4" fill="#f5f5f5"/>
      <text x="596" y="504" class="arrow-label">VERSIONS</text>

      <!-- 1 · Install Skill -->
      <rect class="station" x="560" y="88" width="160" height="64" rx="6"/>
      <g transform="translate(572 108) scale(.6667)" color="#4f5d75" aria-hidden="true"><path d="M5 7l5 5l-5 5M12 19h7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g>
      <text x="660" y="116" class="node-name">Install Skill</text><text x="660" y="136" class="sublabel">discovery root</text>

      <!-- 2 · Agent session -->
      <rect class="station" x="768" y="208" width="160" height="64" rx="6"/>
      <g transform="translate(780 228) scale(.6667)" color="#4f5d75" aria-hidden="true"><path d="M6 6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V6M12 2v2M9 12v9M15 12v9M5 16l4-2M15 14l4 2M9 18h6M10 8v.01M14 8v.01" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g>
      <text x="868" y="236" class="node-name">Agent Session</text><text x="868" y="256" class="sublabel">Codex · Claude Code</text>

      <!-- 3 · Bridge trajectory -->
      <rect class="station" x="768" y="448" width="160" height="64" rx="6"/>
      <g transform="translate(780 468) scale(.6667)" color="#4f5d75" aria-hidden="true"><path d="M14 3v4a1 1 0 0 0 1 1h4M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2M9 9h1M9 13h6M9 17h6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g>
      <text x="868" y="476" class="node-name">Bridge Trajectory</text><text x="868" y="496" class="sublabel">normalize · sanitize</text>

      <!-- 4 · Extract Atom, the focal learning gate. -->
      <rect class="station focal" x="560" y="568" width="160" height="64" rx="6"/>
      <g transform="translate(572 588) scale(.6667)" color="#eb6c36" aria-hidden="true"><path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0-14 0M21 21l-6-6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g>
      <text x="660" y="596" class="node-name focal-name">Extract Atom</text><text x="660" y="616" class="sublabel">replay: 3 · 2 mis-splits</text>

      <!-- 5 · Evolve Skill -->
      <rect class="station" x="352" y="448" width="160" height="64" rx="6"/>
      <g transform="translate(364 468) scale(.6667)" color="#4f5d75" aria-hidden="true"><path d="M5 18a2 2 0 1 0 4 0a2 2 0 1 0-4 0M5 6a2 2 0 1 0 4 0a2 2 0 1 0-4 0M15 6a2 2 0 1 0 4 0a2 2 0 1 0-4 0M7 8v8M9 18h6a2 2 0 0 0 2-2v-5M14 14l3-3l3 3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g>
      <text x="452" y="476" class="node-name">Evolve Skill</text><text x="452" y="496" class="sublabel">candidate · Git · canary</text>

      <!-- 6 · Reinject version -->
      <rect class="station" x="352" y="208" width="160" height="64" rx="6"/>
      <g transform="translate(364 228) scale(.6667)" color="#4f5d75" aria-hidden="true"><path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 5v4h4M4 13a8.1 8.1 0 0 0 15.5 2M20 19v-4h-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g>
      <text x="452" y="236" class="node-name">Reinject Version</text><text x="452" y="256" class="sublabel">manifest · reconcile</text>

      <!-- One accumulated state hub, not another process step. -->
      <rect class="hub" x="540" y="308" width="200" height="104" rx="8"/>
      <g transform="translate(628 324) scale(1)" color="#f5f5f5" aria-hidden="true"><path d="M4 6a8 3 0 1 0 16 0a8 3 0 1 0-16 0M4 6v6a8 3 0 0 0 16 0V6M4 12v6a8 3 0 0 0 16 0v-6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g>
      <text x="640" y="372" class="hub-name">XSkill Memory</text>
      <text x="640" y="392" class="hub-sub">Trajectory · Atom · Git Skill · scores</text>

      <!-- Bottom legend. -->
      <line x1="40" y1="656" x2="1240" y2="656" stroke="rgba(45,49,66,.10)" stroke-width=".8"/>
      <text x="40" y="680" class="legend-tag">LEGEND</text>
      <line x1="144" y1="676" x2="184" y2="676" class="ring" marker-end="url(#loop-arrow)"/><text x="196" y="680" class="legend">clockwise operating flow</text>
      <line x1="396" y1="676" x2="436" y2="676" class="spoke" marker-end="url(#loop-arrow-soft)"/><text x="448" y="680" class="legend">durable write-back</text>
      <rect x="640" y="668" width="20" height="16" rx="4" fill="#2d3142"/><text x="672" y="680" class="legend">shared accumulated state</text>
      <rect x="880" y="668" width="20" height="16" rx="4" fill="rgba(235,108,54,.08)" stroke="#eb6c36"/><text x="912" y="680" class="legend">mixed-result quality gate</text>
    </svg>
  </main>
</body>
</html>
