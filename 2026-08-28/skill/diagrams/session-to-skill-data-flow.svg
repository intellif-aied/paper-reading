<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 356" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="session-flow-title session-flow-desc">
      <title id="session-flow-title">Native session to Skill evidence</title>
      <desc id="session-flow-desc">A native Claude or Codex JSONL session passes a quiet-window barrier, is normalized into a Bridge Trajectory, split into an Atom, routed to a Candidate, and edited into a Git-backed Skill.</desc>
      <defs>
        <style>
          @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');
          .step-number,.step-label,.lane-label,.role-text,.chip-text,.legend-label{font-family:'Geist Mono',monospace;text-anchor:middle}.step-number{fill:#2d3142;font-size:7px;font-weight:600}.step-label{fill:#4f5d75;font-size:7px;font-weight:500;letter-spacing:.12em}.lane-label{fill:#4f5d75;font-size:8px;font-weight:500;letter-spacing:.14em}.role-text{fill:#2d3142;font-size:6px;font-weight:600}.node-title{fill:#2d3142;font:600 9px 'Geist',sans-serif;text-anchor:middle}.node-sub{fill:#4f5d75;font:400 6.5px 'Geist Mono',monospace;text-anchor:middle}.node-tool{fill:#7a8399;font:400 6.5px 'Geist Mono',monospace;text-anchor:middle}.chip-text{fill:#fff;font-size:5px;font-weight:700}.focal-text{fill:#eb6c36}.legend-label{fill:#4f5d75;font-size:7px;font-weight:500;letter-spacing:.12em;text-anchor:end}.legend-text{fill:#4f5d75;font:400 7px 'Geist',sans-serif}
        </style>
        <pattern id="flow-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r=".8" fill="rgba(45,49,66,.10)"/></pattern>
        <marker id="flow-muted" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#4f5d75"/></marker>
        <marker id="flow-accent" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#eb6c36"/></marker>
        <marker id="flow-link" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="840" height="356" fill="#f5f5f5"/>
      <rect width="840" height="356" fill="url(#flow-dots)" opacity=".55"/>
      <rect x="0" y="36" width="840" height="80" fill="rgba(45,49,66,.018)"/>
      <rect x="0" y="196" width="840" height="80" fill="rgba(45,49,66,.018)"/>

      <!-- Header and role lanes. -->
      <line x1="0" y1="36" x2="840" y2="36" stroke="rgba(45,49,66,.12)" stroke-width=".8"/>
      <line x1="0" y1="116" x2="840" y2="116" stroke="rgba(45,49,66,.12)" stroke-width=".8"/>
      <line x1="0" y1="196" x2="840" y2="196" stroke="rgba(45,49,66,.12)" stroke-width=".8"/>
      <line x1="0" y1="276" x2="840" y2="276" stroke="rgba(45,49,66,.12)" stroke-width=".8"/>
      <line x1="140" y1="36" x2="140" y2="276" stroke="rgba(45,49,66,.12)" stroke-width=".8"/>

      <g aria-label="Pipeline steps">
        <rect x="180" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,.12)"/><text x="196" y="14" class="step-number">01</text><text x="196" y="29" class="step-label">CAPTURE</text>
        <rect x="292" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,.12)"/><text x="308" y="14" class="step-number">02</text><text x="308" y="29" class="step-label">SETTLE</text>
        <rect x="404" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,.12)"/><text x="420" y="14" class="step-number">03</text><text x="420" y="29" class="step-label">BRIDGE</text>
        <rect x="516" y="6" width="32" height="16" rx="8" fill="rgba(235,108,54,.20)"/><text x="532" y="14" class="step-number focal-text">04</text><text x="532" y="29" class="step-label focal-text">SPLIT</text>
        <rect x="628" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,.12)"/><text x="644" y="14" class="step-number">05</text><text x="644" y="29" class="step-label">CLUSTER</text>
        <rect x="740" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,.12)"/><text x="756" y="14" class="step-number">06</text><text x="756" y="29" class="step-label">EDIT</text>
      </g>

      <g aria-label="Role lanes">
        <text x="70" y="72" class="lane-label">CODING</text><text x="70" y="84" class="lane-label">HARNESS</text>
        <text x="70" y="152" class="lane-label">ECOSYSTEM</text><text x="70" y="164" class="lane-label">BRIDGE</text>
        <text x="70" y="232" class="lane-label">LEARNING</text><text x="70" y="244" class="lane-label">AGENTS</text>
      </g>

      <!-- Connectors first; the Atom handoff is the one focal transition. -->
      <path d="M246 76 H258" fill="none" stroke="#4f5d75" marker-end="url(#flow-muted)"/>
      <path d="M358 76 H412 Q420 76 420 84 V124" fill="none" stroke="#4f5d75" marker-end="url(#flow-muted)"/>
      <path d="M470 156 H524 Q532 156 532 164 V204" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#flow-accent)"/>
      <path d="M582 236 H594" fill="none" stroke="#4f5d75" marker-end="url(#flow-muted)"/>
      <path d="M694 236 H706" fill="none" stroke="#2e5aa8" marker-end="url(#flow-link)"/>
      <rect x="476" y="136" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="498" y="145" fill="#eb6c36" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".06em">TRAJECTORY</text>

      <!-- Harness lane. -->
      <rect x="146" y="44" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,.25)"/>
      <rect x="150" y="48" width="18" height="10" rx="3" fill="rgba(45,49,66,.12)"/><text x="159" y="53" class="role-text">HNS</text>
      <text x="196" y="67" class="node-title">Native Session</text><text x="196" y="79" class="node-sub">events → JSONL</text><text x="196" y="91" class="node-tool">Claude · Codex</text>
      <rect x="150" y="98" width="16" height="8" rx="3" fill="#4a7c59"/><text x="158" y="104" class="chip-text">LS</text>
      <rect x="226" y="98" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="234" y="104" class="chip-text">DB</text>

      <rect x="258" y="44" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,.25)"/>
      <rect x="262" y="48" width="18" height="10" rx="3" fill="rgba(45,49,66,.12)"/><text x="271" y="53" class="role-text">HNS</text>
      <text x="308" y="67" class="node-title">Quiet Window</text><text x="308" y="79" class="node-sub">mtime stable</text><text x="308" y="91" class="node-tool">default 120s</text>
      <rect x="262" y="98" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="270" y="104" class="chip-text">DB</text>
      <rect x="338" y="98" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="346" y="104" class="chip-text">DB</text>

      <!-- Ecosystem bridge lane. -->
      <rect x="370" y="124" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,.25)"/>
      <rect x="374" y="128" width="18" height="10" rx="3" fill="rgba(45,49,66,.12)"/><text x="383" y="133" class="role-text">BRG</text>
      <text x="420" y="147" class="node-title">Normalize</text><text x="420" y="159" class="node-sub">adapter · sanitizer</text><text x="420" y="171" class="node-tool">Markdown + sidecar</text>
      <rect x="374" y="178" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="382" y="184" class="chip-text">DB</text>
      <rect x="450" y="178" width="16" height="8" rx="3" fill="#b8915a"/><text x="458" y="184" class="chip-text">TB</text>

      <!-- Learning-agent lane. -->
      <rect x="482" y="204" width="100" height="64" rx="6" fill="rgba(235,108,54,.07)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="486" y="208" width="18" height="10" rx="3" fill="rgba(235,108,54,.20)"/><text x="495" y="213" class="role-text focal-text">AGT</text>
      <text x="532" y="227" class="node-title">TaskAgent</text><text x="532" y="239" class="node-sub">intent → Atom</text><text x="532" y="251" class="node-tool">continuous same task</text>
      <rect x="486" y="258" width="16" height="8" rx="3" fill="#b8915a"/><text x="494" y="264" class="chip-text">TB</text>
      <rect x="562" y="258" width="16" height="8" rx="3" fill="#b8915a"/><text x="570" y="264" class="chip-text">TB</text>

      <rect x="594" y="204" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,.25)"/>
      <rect x="598" y="208" width="18" height="10" rx="3" fill="rgba(45,49,66,.12)"/><text x="607" y="213" class="role-text">AGT</text>
      <text x="644" y="227" class="node-title">ClusterAgent</text><text x="644" y="239" class="node-sub">Atom → Candidate</text><text x="644" y="251" class="node-tool">weightscore 1–10</text>
      <rect x="598" y="258" width="16" height="8" rx="3" fill="#b8915a"/><text x="606" y="264" class="chip-text">TB</text>
      <rect x="674" y="258" width="16" height="8" rx="3" fill="#b8915a"/><text x="682" y="264" class="chip-text">TB</text>

      <rect x="706" y="204" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,.25)"/>
      <rect x="710" y="208" width="18" height="10" rx="3" fill="rgba(45,49,66,.12)"/><text x="719" y="213" class="role-text">AGT</text>
      <text x="756" y="227" class="node-title">SkillEditAgent</text><text x="756" y="239" class="node-sub">evidence → Skill</text><text x="756" y="251" class="node-tool">SKILL.md + Git</text>
      <rect x="710" y="258" width="16" height="8" rx="3" fill="#b8915a"/><text x="718" y="264" class="chip-text">TB</text>
      <rect x="786" y="258" width="16" height="8" rx="3" fill="#9c6b50"/><text x="794" y="264" class="chip-text">FL</text>

      <!-- Compact legend. -->
      <text x="164" y="294" class="legend-label">DATA</text>
      <rect x="180" y="286" width="16" height="8" rx="3" fill="#4a7c59"/><text x="188" y="292" class="chip-text">LS</text><text x="202" y="294" class="legend-text">event</text>
      <rect x="252" y="286" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="260" y="292" class="chip-text">DB</text><text x="274" y="294" class="legend-text">session data</text>
      <rect x="360" y="286" width="16" height="8" rx="3" fill="#b8915a"/><text x="368" y="292" class="chip-text">TB</text><text x="382" y="294" class="legend-text">structured evidence</text>
      <rect x="520" y="286" width="16" height="8" rx="3" fill="#9c6b50"/><text x="528" y="292" class="chip-text">FL</text><text x="542" y="294" class="legend-text">Skill package</text>
      <text x="164" y="318" class="legend-label">FLOW</text>
      <line x1="180" y1="315" x2="204" y2="315" stroke="#4f5d75" marker-end="url(#flow-muted)"/><text x="212" y="318" class="legend-text">normal handoff</text>
      <line x1="336" y1="315" x2="360" y2="315" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#flow-accent)"/><text x="368" y="318" class="legend-text">Atom extraction gate</text>
      <line x1="516" y1="315" x2="540" y2="315" stroke="#2e5aa8" marker-end="url(#flow-link)"/><text x="548" y="318" class="legend-text">versioned output</text>
      <text x="164" y="342" class="legend-label">BOUNDARY</text><text x="180" y="342" class="legend-text">harness files → normalized evidence → learning agents</text>
    </svg>
