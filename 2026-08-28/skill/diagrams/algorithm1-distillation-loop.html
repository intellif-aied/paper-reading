<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Algorithm 1：三 Agent 蒸馏循环</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f5f5f5}body{display:grid;place-items:center;font-family:Geist,"Noto Sans SC","Microsoft YaHei",sans-serif}.frame{width:100%;overflow:auto}svg{display:block;width:100%;min-width:900px;height:auto}.title{font:400 40px "Instrument Serif","Noto Serif SC",serif;fill:#2d3142}.eyebrow,.mono,.tag,.edge{font-family:"Geist Mono","Noto Sans Mono CJK SC",monospace}.eyebrow{font-size:12px;letter-spacing:2px;fill:#4f5d75}.stage{fill:#fff;stroke:#bfc0c0;stroke-width:1}.store{fill:rgba(45,49,66,.05);stroke:#4f5d75;stroke-width:1}.focal{fill:rgba(235,108,54,.08);stroke:#eb6c36;stroke-width:1.2}.tag{font-size:8px;font-weight:500;letter-spacing:1px;fill:#4f5d75}.name{font-size:20px;font-weight:600;fill:#2d3142}.copy{font-size:12px;fill:#4f5d75}.code{font:400 12px "Geist Mono",monospace;fill:#2e5aa8}.flow{fill:none;stroke:#4f5d75;stroke-width:1.2;marker-end:url(#alg1-arrow)}.flow-accent{fill:none;stroke:#eb6c36;stroke-width:1.2;marker-end:url(#alg1-arrow-accent)}.flow-loop{fill:none;stroke:#4f5d75;stroke-width:1;stroke-dasharray:4 4;marker-end:url(#alg1-arrow)}.edge{font-size:8px;letter-spacing:1px;fill:#7a8399}.decision{fill:#fff;stroke:#2d3142;stroke-width:1.2}.wait{fill:#fff;stroke:#7a8399;stroke-width:1;stroke-dasharray:4 4}.aside{font:italic 16px "Instrument Serif","Noto Serif SC",serif;fill:#4f5d75}
  </style>
</head>
<body><div class="frame">
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="alg1-loop-title alg1-loop-desc">
  <title id="alg1-loop-title">Algorithm 1：三 Agent 蒸馏循环</title>
  <desc id="alg1-loop-desc">每条轨迹先被 TaskAgent 切成 AtomTask，再由 TaskClusterAgent 路由进候选证据池。证据权重没有达到阈值时等待下一条轨迹并重新循环；达到阈值且通过守卫条件后，SkillEditAgent 生成 SKILL.md，并提交到 main 或 staging。</desc>
  <defs>
    <marker id="alg1-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
    <marker id="alg1-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
    <marker id="alg1-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#f5f5f5"/>
  <text class="eyebrow" x="48" y="44">ALGORITHM 1 · PROCESS + FEEDBACK LOOP</text>
  <text class="title" x="48" y="88">关键不是三个 Agent，而是证据跨 Session 累积</text>

  <!-- Connectors first -->
  <path class="flow" d="M304 236 H352"/>
  <path class="flow" d="M592 236 H640"/>
  <path class="flow" d="M760 312 V360"/>
  <path class="flow-accent" d="M848 416 H928"/>
  <path class="flow-loop" d="M760 472 V520"/>
  <path class="flow-loop" d="M544 560 H184 Q168 560 168 544 V328 Q168 312 184 312"/>

  <!-- Arrow labels with paper masks -->
  <rect x="312" y="208" width="32" height="12" rx="2" fill="#f5f5f5"/><text class="edge" x="328" y="216" text-anchor="middle">ATOMS</text>
  <rect x="600" y="208" width="32" height="12" rx="2" fill="#f5f5f5"/><text class="edge" x="616" y="216" text-anchor="middle">ROUTE</text>
  <rect x="864" y="388" width="48" height="12" rx="2" fill="#f5f5f5"/><text class="edge" x="888" y="396" text-anchor="middle">THRESHOLD</text>
  <rect x="432" y="536" width="88" height="12" rx="2" fill="#f5f5f5"/><text class="edge" x="476" y="544" text-anchor="middle">NEXT DELTA δ</text>

  <rect class="stage" x="64" y="160" width="240" height="152" rx="8"/>
  <text class="tag" x="80" y="184">STAGE 1 · SERVER</text>
  <text class="name" x="80" y="216">TaskAgent</text>
  <text class="copy" x="80" y="244">按语义边界切开 trajectory delta</text>
  <text class="code" x="80" y="272">AtomTask + ux_score</text>
  <text class="copy" x="80" y="296">记录 intent · tags · used_skills</text>

  <rect class="stage" x="352" y="160" width="240" height="152" rx="8"/>
  <text class="tag" x="368" y="184">STAGE 2 · SERVER</text>
  <text class="name" x="368" y="216">TaskClusterAgent</text>
  <text class="copy" x="368" y="244">对每个 AtomTask 决策</text>
  <text class="code" x="368" y="272">CREATE · ROUTE · RECLASSIFY</text>
  <text class="copy" x="368" y="296">同时产生 evidence weight w</text>

  <rect class="store" x="640" y="160" width="240" height="152" rx="8"/>
  <text class="tag" x="656" y="184">DURABLE EVIDENCE</text>
  <text class="name" x="656" y="216">候选证据池</text>
  <text class="code" x="656" y="244">skill/.candidates.yml</text>
  <text class="copy" x="656" y="272">按 Skill 跨 Session 追加 (a, w)</text>
  <text class="copy" x="656" y="296">不是每条会话都立刻生成 Skill</text>

  <polygon class="decision" points="760,360 848,416 760,472 672,416"/>
  <text class="tag" x="760" y="404" text-anchor="middle">GATE</text>
  <text class="name" x="760" y="428" text-anchor="middle">Σw ≥ 10?</text>
  <text class="copy" x="760" y="448" text-anchor="middle">+ guards pass</text>
  <text class="edge" x="856" y="408">YES</text>
  <text class="edge" x="772" y="500">NO</text>

  <rect class="focal" x="928" y="352" width="288" height="160" rx="8"/>
  <text class="tag" x="944" y="376">STAGE 3 · SERVER + GIT</text>
  <text class="name" x="944" y="408">SkillEditAgent</text>
  <text class="copy" x="944" y="436">候选证据 + existing body → SKILL.md</text>
  <text class="code" x="944" y="464">baby → commit main</text>
  <text class="code" x="944" y="488">existing → commit staging</text>

  <rect class="wait" x="544" y="520" width="240" height="80" rx="8"/>
  <text class="name" x="664" y="552" text-anchor="middle">等待更多证据</text>
  <text class="copy" x="664" y="576" text-anchor="middle">下一条 trajectory delta 重新进入 Stage 1</text>

  <line x1="48" y1="648" x2="1232" y2="648" stroke="rgba(45,49,66,.12)" stroke-width="1"/>
  <text class="aside" x="48" y="680">Loop 的状态保存在 candidates.yml：会话结束了，证据并没有消失。</text>
</svg>
</div></body>
</html>
