<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skill 版本管理</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f5f5f5}body{display:grid;place-items:center;font-family:Geist,"Noto Sans SC","Microsoft YaHei",sans-serif}.frame{width:100%;overflow:auto}svg{display:block;width:100%;min-width:900px;height:auto}.title{font:400 40px "Instrument Serif","Noto Serif SC",serif;fill:#2d3142}.eyebrow,.mono{font-family:"Geist Mono","Noto Sans Mono CJK SC",monospace}.eyebrow{font-size:12px;letter-spacing:2px;fill:#4f5d75}.lane-title{font:600 14px "Geist Mono","Noto Sans Mono CJK SC",monospace;letter-spacing:1px;fill:#4f5d75}.label{font-size:18px;font-weight:600;fill:#2d3142}.sub{font-size:12px;fill:#4f5d75}.lane{fill:#fff;stroke:#c8cdd7;stroke-width:2}.node{fill:#fff;stroke:#4f5d75;stroke-width:2}.accent{fill:#fff5ef;stroke:#eb6c36;stroke-width:3}.store{fill:#eef3fb;stroke:#2e5aa8;stroke-width:2}.rejected{fill:#edf0f4;stroke:#7a8399;stroke-width:2;stroke-dasharray:8 8}.flow{fill:none;stroke:#4f5d75;stroke-width:2;marker-end:url(#version-arrow)}.primary{fill:none;stroke:#eb6c36;stroke-width:3;marker-end:url(#version-arrow-accent)}.link{fill:none;stroke:#2e5aa8;stroke-width:2;marker-end:url(#version-arrow-link)}.edge{font:500 12px "Geist Mono","Noto Sans Mono CJK SC",monospace;fill:#4f5d75}.note{fill:#fff8e8;stroke:#d6a63c;stroke-width:2}.note-copy{font-size:13px;fill:#604a18}
  </style>
</head>
<body><div class="frame">
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="version-title version-desc">
  <title id="version-title">Skill 版本管理</title>
  <desc id="version-desc">一个 Skill 是完整目录，一个版本是该目录的 Git commit。新 Skill 在 Baby 分支生成后成为第一个 Main。已有 Skill 的更新先成为 Staging，与 Main 同时接受真实任务；候选胜出后成为新的 Main，失败版本保留为可审计引用。</desc>
  <defs>
    <marker id="version-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
    <marker id="version-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
    <marker id="version-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#f5f5f5"/>
  <text class="eyebrow" x="48" y="44">VERSION MANAGEMENT · GIT COMMITS</text>
  <text class="title" x="48" y="88">一个目录，两个同时可用的版本</text>

  <rect class="lane" x="48" y="124" width="1184" height="184" rx="16"/>
  <rect class="lane" x="48" y="332" width="1184" height="272" rx="16"/>
  <text class="lane-title" x="72" y="154">新 SKILL · 第一次生成</text>
  <text class="lane-title" x="72" y="362">已有 SKILL · 后续更新</text>

  <!-- Connectors first -->
  <path class="primary" d="M364 224 H500"/>
  <path class="flow" d="M692 224 H828"/>
  <path class="primary" d="M364 468 H500"/>
  <path class="flow" d="M692 468 H780"/>
  <path class="link" d="M916 424 V392 H1044 V424"/>
  <path class="flow" d="M916 512 V544 H1044 V512"/>

  <rect class="node" x="172" y="176" width="192" height="96" rx="12"/>
  <text class="label" x="268" y="208" text-anchor="middle">候选证据够用</text>
  <text class="sub mono" x="268" y="236" text-anchor="middle">Σ weightscore ≥ 10</text>
  <rect class="accent" x="500" y="176" width="192" height="96" rx="12"/>
  <text class="label" x="596" y="208" text-anchor="middle">Baby</text>
  <text class="sub" x="596" y="236" text-anchor="middle">分批写完第一版</text>
  <rect class="store" x="828" y="176" width="208" height="96" rx="12"/>
  <text class="label" x="932" y="208" text-anchor="middle">Main · 第一个稳定版</text>
  <text class="sub mono" x="932" y="236" text-anchor="middle">commit 6aa1e9…</text>

  <rect class="store" x="172" y="420" width="192" height="96" rx="12"/>
  <text class="label" x="268" y="452" text-anchor="middle">Main · 当前版</text>
  <text class="sub mono" x="268" y="480" text-anchor="middle">commit 6aa1e9…</text>
  <rect class="accent" x="500" y="420" width="192" height="96" rx="12"/>
  <text class="label" x="596" y="452" text-anchor="middle">Staging · 候选版</text>
  <text class="sub mono" x="596" y="480" text-anchor="middle">commit b71c42…</text>
  <rect class="node" x="780" y="420" width="136" height="96" rx="12"/>
  <text class="label" x="848" y="452" text-anchor="middle">真实流量比较</text>
  <text class="sub" x="848" y="480" text-anchor="middle">Main vs Staging</text>
  <rect class="store" x="1044" y="420" width="164" height="96" rx="12"/>
  <text class="label" x="1126" y="452" text-anchor="middle">新的 Main</text>
  <text class="sub mono" x="1126" y="480" text-anchor="middle">b71c42…</text>
  <rect class="rejected" x="972" y="544" width="236" height="40" rx="10"/>
  <text class="sub" x="1090" y="569" text-anchor="middle">未胜出：保留提交，Main 不变</text>

  <text class="edge" x="432" y="208" text-anchor="middle">创建</text>
  <text class="edge" x="760" y="208" text-anchor="middle">完成</text>
  <text class="edge" x="432" y="452" text-anchor="middle">新改动</text>
  <text class="edge" x="736" y="452" text-anchor="middle">小流量</text>
  <text class="edge" x="980" y="384" text-anchor="middle">候选更好</text>
  <text class="edge" x="976" y="536" text-anchor="middle">没有更好</text>

</svg>
</div></body>
</html>
