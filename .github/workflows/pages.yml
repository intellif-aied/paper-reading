name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Verify disclosure rendering
        run: >-
          node -e 'const s=require("fs").readFileSync("_site/2026-08-28/skill/index.html","utf8");const b=[...s.matchAll(/<details[\s\S]*?<\/details>/g)].map(x=>x[0]);const bad=b.filter(x=>/`[^`]+`|\[[^\]]+\]\([^)]+\)/.test(x));console.log(`details=${b.length} broken=${bad.length}`);if(b.length!==6||bad.length)process.exit(1)'
      - uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
