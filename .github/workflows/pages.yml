name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Verify XSkill pages
        run: >-
          node -e 'const fs=require("fs");const dir="_site/2026-08-28/skill/";const paths=["index.html","report.html","reanalysis.html","narratives.html"];const pages=Object.fromEntries(paths.map(p=>[p,fs.readFileSync(dir+p,"utf8")]));const s=pages["index.html"];const slides=(s.match(/<section class="slide/g)||[]).length;const frames=(s.match(/<iframe class="diagram"/g)||[]).length;const ids=[...s.matchAll(/\sid="([^"]+)"/g)].map(x=>x[1]);const duplicateIds=ids.filter((x,i)=>ids.indexOf(x)!==i);const rootAssets=[...s.matchAll(/(?:src|href)="\/(?!\/)/g)];const required=/三种叙事方案/.test(pages["report.html"])&&[/方案 A/,/方案 B/,/方案 C/].every(x=>x.test(pages["narratives.html"]))&&/Exposure attribution/.test(pages["reanalysis.html"]);console.log({slides,frames,duplicateIds:duplicateIds.length,rootAssets:rootAssets.length,pages:paths.length,required});if(slides!==26||frames<9||duplicateIds.length||rootAssets.length||!required)process.exit(1)'
      - uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
