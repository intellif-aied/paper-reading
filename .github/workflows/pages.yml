name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: 2026-08-28/skill/slidev/pnpm-lock.yaml
      - name: Build XSkill Slidev deck
        run: |
          pnpm --dir 2026-08-28/skill/slidev install --frozen-lockfile
          pnpm --dir 2026-08-28/skill/slidev build
          cp -R 2026-08-28/skill/slidev/dist/. 2026-08-28/skill/
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Verify XSkill pages
        run: >-
          node -e 'const fs=require("fs"),path=require("path");const src=fs.readFileSync("2026-08-28/skill/slidev/slides.md","utf8"),dir="_site/2026-08-28/skill/",index=fs.readFileSync(dir+"index.html","utf8"),paths=["report.html","reanalysis.html","narratives.html"],pages=Object.fromEntries(paths.map(p=>[p,fs.readFileSync(dir+p,"utf8")]));const slides=(src.match(/data-slide="/g)||[]).length,frames=[...src.matchAll(/<iframe class="diagram" src="[^"]*\/([^"\/]+)"/g)].map(x=>x[1]),base="/paper-reading/2026-08-28/skill/",assets=index.includes(base+"assets/"),diagrams=frames.every(f=>fs.existsSync(path.join(dir,f))),required=/slidev:version/.test(index)&&index.includes("id=\"app\"")&&/三种叙事方案/.test(pages["report.html"])&&[/方案 A/,/方案 B/,/方案 C/].every(x=>x.test(pages["narratives.html"]))&&/Exposure attribution/.test(pages["reanalysis.html"]),regressions=/routerMode:\s*hash/.test(src)&&(src.match(/layout: section/g)||[]).length===4&&(src.match(/level: 1/g)||[]).length===4&&(src.match(/level: 2/g)||[]).length===8&&src.includes("<Toc :columns=\"2\" :maxDepth=\"2\" />")&&["questions","objects","two-scores","canary-definition","ux-score","appendix-modes"].every(id=>new RegExp(`class="[^"]*xslide[^"]*fit[^"]*" data-slide="${id}"`).test(src))&&["chapter-capture","chapter-generate","chapter-evaluate","chapter-return"].every(id=>src.includes(`data-slide="${id}"`))&&frames.includes("skill-return-flow.html")&&fs.existsSync("2026-08-28/skill/slidev/custom-nav-controls.vue");console.log({slides,frames:frames.length,assets,diagrams,pages:paths.length,required,regressions});if(slides!==21||frames.length!==6||!assets||!diagrams||!required||!regressions)process.exit(1)'
      - uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
